name: Cloud build (no signing secrets)

# Downloadable Linux, Windows and macOS builds without any release secrets.
#
# The upstream `release.yml` is the real release pipeline: it runs `tauri build`
# for six targets, signs them (Apple certificate, Azure Trusted Signing) and
# publishes to Cloudflare R2 with an updater manifest — all of which needs
# secrets this mirror does not have. This workflow is the "just give me a
# binary" path: it builds release binaries and attaches them as workflow
# artifacts, nothing else.
#
# Linux and Windows both go through `tauri build`, so the workbench is baked
# into the binary and starts without a local dev server. Linux ships the raw
# release binary plus its resources; Windows ships the NSIS installer. A bare
# `cargo build --release` must not be used here: it leaves the binary on `devUrl`
# (`http://localhost:1420`) and the packaged app opens blank or fails with
# "localhost fail connect".
#
# Downloads stay small: the build uses the repo's shipping Cargo profile (LTO +
# `strip`), and each platform ships exactly one artifact — no duplicate copies of
# the executable, no portable zip next to an installer that compresses better.
#
# macOS (Apple Silicon) is also `tauri build`, producing a real SideX.app
# (unsigned — see docs/CLOUD-BUILD.md for how to open it past Gatekeeper). Only
# the common architectures are built.
#
# Trigger it from the Actions tab ("Run workflow") or by pushing a tag; tags
# additionally attach the files to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (use macos for a single Apple Silicon DMG)"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
  push:
    tags: ['v*']

# A newer run replaces an in-flight one instead of queueing behind it.
concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # These artifacts are what people download and run, so build them with the
  # repo's shipping profile (`lto = "thin"`, `codegen-units = 1`, `strip`,
  # `panic = "abort"` — see the root Cargo.toml). Those settings make the binary
  # both smaller and faster, and they used to be overridden here to
  # `codegen-units = 16` / `lto = false` to shorten the build; that trade is not
  # worth it for a release. Build time goes up noticeably (LTO serialises
  # codegen) — put the two `CARGO_PROFILE_RELEASE_*` overrides back if a quick
  # throwaway test build matters more than size.

jobs:
  linux-x86_64:
    name: linux-x86_64
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Frontend
        run: |
          npm ci --no-audit --no-fund
          bash scripts/ensure-file-icon-theme.sh
          bash scripts/ensure-pdfium-wasm.sh
          npm run build

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: fast-release

      - name: Build
        # `tauri build` (not a bare `cargo build --release`): only the CLI sets
        # the production cfg and bakes `frontendDist` into the binary. A
        # cargo-built binary keeps pointing at Vite's `devUrl`
        # (`http://localhost:1420`) and opens an empty window — or, on Windows,
        # just "localhost fail connect" — unless something serves `dist/` there.
        run: npx tauri build --no-bundle

      - name: Package
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NAME="sidex-${VERSION}-linux-x86_64"
          # `src-tauri` is a workspace member, so the binary lands in the
          # workspace target dir rather than src-tauri/target.
          BIN=""
          for candidate in target/release/SideX src-tauri/target/release/SideX; do
            if [ -f "$candidate" ]; then BIN="$candidate"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "release binary not found; looked in target/release and src-tauri/target/release"
            find . -maxdepth 4 -type f -name 'SideX' | head
            exit 1
          fi
          mkdir -p "dist-pkg/${NAME}/bin"
          cp "$BIN" "dist-pkg/${NAME}/SideX"
          # CLI: `sidex` on PATH after `./bin/sidex --install-cli` or copying bin/
          cp scripts/sidex "dist-pkg/${NAME}/bin/sidex"
          chmod +x "dist-pkg/${NAME}/bin/sidex" "dist-pkg/${NAME}/SideX"
          ln -sfn ../SideX "dist-pkg/${NAME}/bin/SideX"
          cp scripts/install-cli.sh "dist-pkg/${NAME}/install-cli.sh"
          chmod +x "dist-pkg/${NAME}/install-cli.sh"
          # Resources are resolved next to the executable when not bundled.
          cp -a src-tauri/extension-host "dist-pkg/${NAME}/" 2>/dev/null || true
          cp -a src-tauri/shell-integration "dist-pkg/${NAME}/" 2>/dev/null || true
          cp docs/CLOUD-BUILD.md "dist-pkg/${NAME}/README.md"
          ( cd dist-pkg && tar czf "../${NAME}.tar.gz" "${NAME}" )
          ls -lh "${NAME}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sidex-linux-x86_64
          path: sidex-*.tar.gz

  windows-x86_64:
    name: windows-x86_64
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend
        run: |
          npm ci --no-audit --no-fund
          bash scripts/ensure-pdfium-wasm.sh
          npm run build

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: fast-release

      - name: Build
        # `tauri build`, not `cargo build --release`: only the CLI bakes
        # `frontendDist` into the binary and flips it to production. A
        # cargo-built SideX.exe keeps loading Vite's `devUrl`
        # (`http://localhost:1420`) and dies with "localhost fail connect"
        # because nothing serves that port on a user's machine.
        run: npx tauri build --bundles nsis

      - name: Package
        shell: pwsh
        run: |
          # The NSIS installer is the only Windows download. It already carries
          # the app, its resources and the WebView2 bootstrapper, and it compresses
          # far better than a zip holding the same binary: the old portable zip was
          # ~75 MB because `SideX.exe` was stored twice (root + bin\), while the
          # installer of the identical build is ~32 MB. Add a `--no-bundle` step
          # and a zip back if a portable build is ever needed.
          $version = node -p "require('./package.json').version"
          $setup = @(
            "target/release/bundle/nsis/*-setup.exe",
            "src-tauri/target/release/bundle/nsis/*-setup.exe"
          ) | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found under target/release/bundle/nsis" }
          Copy-Item $setup.FullName "sidex-$version-windows-x86_64-setup.exe"
          Get-ChildItem "sidex-*-setup.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: sidex-windows-x86_64
          path: sidex-*-setup.exe

  macos:
    name: macos-${{ matrix.arch }}
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the common architecture: Apple Silicon. Add
          # `- arch: x64 / target: x86_64-apple-darwin` here if Intel Macs
          # need a build - it is a cross-compile, so it doubles macOS time.
          - arch: arm64
            target: aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `tauri build` runs `npm run build` itself (beforeBuildCommand) and then
      # bundles SideX.app, so only the dependencies are needed here.
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: fast-release-${{ matrix.target }}

      - name: Install create-dmg
        run: |
          brew install create-dmg
          sudo ln -sf "$(which create-dmg)" /usr/local/bin/create-dmg

      - name: Ensure built-in file icons
        run: |
          bash scripts/ensure-file-icon-theme.sh
          bash scripts/ensure-pdfium-wasm.sh

      - name: Build the macOS DMG
        # Default mac artifact is .dmg (VS Code / typical desktop feel).
        # Unsigned: no Apple certificate in this mirror. create-dmg is required.
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Package
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NAME="sidex-${VERSION}-macos-${{ matrix.arch }}"
          DMG=""
          for candidate in \
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg \
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg; do
            if [ -f "$candidate" ]; then DMG="$candidate"; break; fi
          done
          if [ -z "$DMG" ]; then
            echo "no .dmg found for ${{ matrix.target }}; falling back to .app zip"
            APP=""
            for candidate in \
              "target/${{ matrix.target }}/release/bundle/macos/SideX.app" \
              "src-tauri/target/${{ matrix.target }}/release/bundle/macos/SideX.app"; do
              if [ -d "$candidate" ]; then APP="$candidate"; break; fi
            done
            if [ -z "$APP" ]; then
              echo "no app bundle either"
              find . -maxdepth 8 \( -name '*.dmg' -o -name 'SideX.app' \) | head
              exit 1
            fi
            codesign --force --deep --sign - "$APP" || true
            ditto -c -k --sequesterRsrc --keepParent "$APP" "${NAME}.zip"
            ls -lh "${NAME}.zip"
            exit 0
          fi
          # Ad-hoc sign the .app inside the dmg volume is not practical here;
          # sign the .app before bundling when present, then copy the dmg.
          APP_DIR=""
          for candidate in \
            "target/${{ matrix.target }}/release/bundle/macos/SideX.app" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/SideX.app"; do
            if [ -d "$candidate" ]; then APP_DIR="$candidate"; break; fi
          done
          if [ -n "$APP_DIR" ]; then
            codesign --force --deep --sign - "$APP_DIR" || true
          fi
          cp "$DMG" "${NAME}.dmg"
          ls -lh "${NAME}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: sidex-macos-${{ matrix.arch }}
          path: |
            sidex-*.dmg
            sidex-*.zip

  release:
    name: attach to release
    # Skip when a needed build was cancelled/failed; skipped platform jobs (macos-only
    # dispatch) are fine — only tag pushes reach here and tags always build all three.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [linux-x86_64, windows-x86_64, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # No checkout on this job — pass -R so `gh` does not look for a .git dir.
      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          {
            echo "Unsigned cloud build of \`${GITHUB_REF_NAME}\`. All three platforms are built"
            echo 'with `tauri build`, so the workbench is embedded in the binary and the app'
            echo "starts on its own — no local server, no \`localhost:1420\`."
            echo
            echo "- **Windows**: \`*-setup.exe\` — NSIS installer. Installs the WebView2 bootstrapper if it is missing."
            echo "- **Linux**: \`*.tar.gz\` — unpack and run \`./SideX\`; \`./install-cli.sh\` puts \`sidex\` on your PATH."
            echo "- **macOS (Apple Silicon)**: \`*.dmg\` — unsigned, so clear the quarantine flag first:"
            echo '  `xattr -dr com.apple.quarantine /Applications/SideX.app`'
            echo
            echo 'The AI panel stays off until `sidex.chat.enabled` is turned on.'
          } > release-notes.md
          gh release view "${GITHUB_REF_NAME}" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" -R "$REPO" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          # Upload only files (skip empty dirs from merge-multiple)
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts to upload" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" -R "$REPO" "${files[@]}" --clobber
